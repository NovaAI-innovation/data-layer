# data-layer/docker-compose.yml
#
# CANONICAL DEPLOYMENT FILE for the data-layer bootstrap kit.
# Per principal directive 2026-09-17, the native in-container wire-up inside the
# Agent Zero runtime container is DEPRECATED (its supervisor programs were
# disabled at user request); this compose file is the supported deployment path
# on any host with Docker.
#
# Brings up the full stack in dependency order:
#   a0-init   → FIRST: populate shared A0 volumes (venv + usr) from the
#              official agent0ai/agent-zero image — this materializes
#              /opt/venv-a0 BEFORE any wiring runs, which is exactly what
#              the agent-zero deps step requires (principal directive
#              2026-09-17: "the agent zero container should be the first
#              one installed in this bootstrap").
#   postgres  → schema service (SOT)            [data-layer-postgres]
#   redis     → bounded cache + pub/sub (Valkey)[data-layer-redis]
#   falkordb  → graph service (RESP module)     [data-layer-falkordb]
#   qdrant    → vector / RAG layer              [data-layer-qdrant]
#   adapters  → publish-hook sidecar            [data-layer-adapters]
#   agent-zero→ one-shot A0 wiring: installs psycopg+mcp INTO the shared
#              /opt/venv-a0 volume + data_management plugin into the shared
#              /a0/usr volume + seeds the agent row (exit 0 on success)
#   a0        → hardened Agent Zero runtime on the SAME shared volumes —
#              boots with plugin + deps already in place (WebUI :81, SSH :23)
#   validate  → read-only smoke/validation run  [data-layer-validate] (profile: validate)
#
# Shared A0 state lives in named volumes a0_venv + a0_usr, populated once by
# a0-init (Docker copies image content into an empty named volume on first
# mount) and reused by the wiring one-shot and the runtime container.
#
# ── The +1 port rule ────────────────────────────────────────────────
# Every HOST-visible port = service standard port + 1. On collision the
# assignment escalates deterministically (+2) in stack-composition order.
# Internal/container ports ALWAYS stay standard. Consumers inside the
# compose network use standard ports; only host-side integrations use +1.
#
#   Service        Standard   Host-published
#   postgres       5432  →    5433
#   redis/valkey   6379  →    6380
#   falkordb RESP  6379  →    6381   (6380 taken by valkey → +2)
#   falkordb bolt  7687  →    7688
#   falkordb web   3000  →    3001
#   qdrant HTTP    6333  →    6334
#   qdrant gRPC    6334  →    6335
#
# ── Unique identity ─────────────────────────────────────────────────
#   compose project : data-layer
#   network         : data_layer (explicit name; external consumers attach by this name)
#   containers      : data-layer-postgres | data-layer-redis | data-layer-falkordb
#                     | data-layer-qdrant | data-layer-adapters | data-layer-agent-zero
#                     | data-layer-validate
#
# ── Validation phase (idempotent, read-only) ────────────────────────
#   docker compose --profile validate up validate
# Runs the adapters' read-only smoke checks against the healthy stack.
# Existing data is verified, never reseeded; safe to re-run any time.
#
# ── Hardened Agent Zero ─────────────────────────────────────────────
# The A0 agent itself ships via deploy/docker-compose.agent-zero.yml
# (WebUI 81, SSH 23 — same +1 rule). It joins this stack's `data_layer`
# network as an external client. See that file's header.
#
# Usage:
#   docker compose up -d --build        # build + start the stack
#   docker compose ps                   # status
#   docker compose --profile validate up validate   # read-only validation phase
#   docker compose logs -f adapters     # tail the publish hook
#   docker compose down                 # stop (volumes preserved)
#   docker compose down -v              # stop + delete volumes (DROPS DATA)
#
# Security notes:
# - postgres: scram-sha-256 (see POSTGRES_HOST_AUTH_METHOD); passwords come
#   from .env / .a0proj/secrets.env — never committed.
# - redis.conf is mounted read-only; add `requirepass` before any shared-network
#   deployment.
# - falkordb RESP is unauthenticated by default; add AUTH if the network is shared.
# - For multi-host exposure over public networks, terminate TLS at a reverse proxy
#   in front of each published port.

name: data-layer

services:
  a0-init:
    # FIRST SERVICE IN THE BOOTSTRAP — no dependencies.
    # One-shot: mounts the shared named volumes over the image's
    # /opt/venv-a0 and /a0/usr. Docker auto-populates empty named volumes
    # from image content at container creation, so after this runs the
    # venv exists in the shared volume for every later service.
    image: agent0ai/agent-zero:latest
    container_name: data-layer-a0-init
    restart: "no"
    command: ["/bin/bash", "-c", "test -x /opt/venv-a0/bin/pip && echo '[a0-init] shared venv populated (/opt/venv-a0)' && ls /opt/venv-a0/bin/python* | head -2; test -d /a0/usr && echo '[a0-init] /a0/usr present' || mkdir -p /a0/usr; echo '[a0-init] done'"]
    volumes:
      - a0_venv:/opt/venv-a0
      - a0_usr:/a0/usr
  postgres:
    build: ./data-layer-postgres
    image: data-layer-postgres
    container_name: data-layer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set in .env, .a0proj/secrets.env, or export in shell)}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
      DATA_LAYER_AGENT_ZERO_PASSWORD: ${DATA_LAYER_AGENT_ZERO_PASSWORD:?DATA_LAYER_AGENT_ZERO_PASSWORD is required (set in .env, .a0proj/secrets.env, or export in shell)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # +1 rule (standard 5432)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data_layer

  redis:
    build: ./data-layer-redis
    image: data-layer-redis
    container_name: data-layer-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      # Explicit read-only config mount: the compose command references this
      # path, so the file must exist in-container even if the Dockerfile copy
      # changes. Source of truth: data-layer-redis/redis.conf (Valkey 8.x).
      - ./data-layer-redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6380:6379"   # +1 rule (standard 6379)
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data_layer

  falkordb:
    build: ./data-layer-falkordb
    image: data-layer-falkordb
    container_name: data-layer-falkordb
    restart: unless-stopped
    environment:
      FALKORDB_PORT: "6379"
      FALKORDB_DATA_DIR: /data
      DATA_LAYER_FALKORDB_DATABASE: ${DATA_LAYER_FALKORDB_DATABASE:-default}
    volumes:
      - falkordb_data:/data
    ports:
      - "6381:6379"   # +1 rule, escalated to +2: 6380 is taken by valkey
      - "7688:7687"   # +1 rule (embedded Next.js web UI)
      - "3001:3000"   # +1 rule
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 6379)); s.sendall(b'PING\\\\r\\\\n'); print(s.recv(100).decode())\" | grep -q PONG"
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data_layer

  qdrant:
    build: ./data-layer-qdrant
    image: data-layer-qdrant
    container_name: data-layer-qdrant
    restart: unless-stopped
    environment:
      # Internal ports stay STANDARD; the +1 mapping happens only at the
      # published-port boundary above/below.
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__LOG_LEVEL: ${DATA_LAYER_QDRANT_LOG_LEVEL:-INFO}
      # MCP_INSTALL_MODE is exported by the qdrant submodule's own
      # bootstrap when it runs the seed step. The MCP server started
      # inside the adapters container does NOT have this set — only
      # the bootstrap-side MCP, which is the whole point of the gate.
      MCP_INSTALL_MODE: ${MCP_INSTALL_MODE:-}
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./data-layer-qdrant/qdrant_config.yaml:/qdrant/config/production.yaml:ro
    ports:
      - "6334:6333"   # +1 rule (HTTP REST; standard 6333)
      - "6335:6334"   # +1 rule (gRPC; standard 6334)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6333/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data_layer

  adapters:
    build: ./data-layer-adapters
    image: data-layer-adapters
    container_name: data-layer-adapters
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      ADAPTER_ROLE: hook
      # Internal service hostnames + STANDARD ports (compose-internal traffic
      # never uses the +1 host mapping).
      DATA_LAYER_POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-postgres}
      DATA_LAYER_AGENT_ZERO_DSN: postgresql://agent_zero:${DATA_LAYER_AGENT_ZERO_PASSWORD:?DATA_LAYER_AGENT_ZERO_PASSWORD is required}@postgres:5432/postgres
      DATA_LAYER_REDIS_URL: redis://redis:6379/0
      DATA_LAYER_REDIS_HOST: redis
      DATA_LAYER_REDIS_PORT: "6379"
      DATA_LAYER_REDIS_PREFIX: "${DATA_LAYER_REDIS_PREFIX:-dl:}"
      DATA_LAYER_REDIS_TTL: "${DATA_LAYER_REDIS_TTL:-300}"
      DATA_LAYER_FALKORDB_HOST: falkordb
      DATA_LAYER_FALKORDB_PORT: "6379"
      DATA_LAYER_FALKORDB_DATABASE: ${DATA_LAYER_FALKORDB_DATABASE:-default}
      DATA_LAYER_QDRANT_URL: http://qdrant:6333
      DATA_LAYER_PUBSUB_PREFIX: "dl:pubsub:"
      DATA_LAYER_DW_SESSION_PRESENCE: "${DATA_LAYER_DW_SESSION_PRESENCE:-true}"
      DATA_LAYER_DW_TOOL_EXECUTION: "${DATA_LAYER_DW_TOOL_EXECUTION:-false}"
      DATA_LAYER_DW_IDEMPOTENCY_KEY: "${DATA_LAYER_DW_IDEMPOTENCY_KEY:-false}"
      DATA_LAYER_DW_RECENT_MESSAGES: "${DATA_LAYER_DW_RECENT_MESSAGES:-false}"
      DATA_LAYER_DW_RATE_LIMIT_EVENT: "${DATA_LAYER_DW_RATE_LIMIT_EVENT:-false}"
      DATA_LAYER_DW_LOCK_AUDIT: "${DATA_LAYER_DW_LOCK_AUDIT:-false}"
      DATA_LAYER_HOOK_PROJECTIONS: ${DATA_LAYER_HOOK_PROJECTIONS:-session.heartbeat}
    networks:
      - data_layer

  validate:
    # READ-ONLY validation phase (profile-gated; never started by `up -d`).
    # Runs the adapters' existing smoke checks against the healthy stack:
    # schema present, collections present, cache/graph reachable. Verifies
    # existing data without reseeding; safe to re-run any time.
    build: ./data-layer-adapters
    image: data-layer-adapters
    container_name: data-layer-validate
    restart: "no"
    profiles: ["validate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      ADAPTER_ROLE: smoke
      DATA_LAYER_POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-postgres}
      DATA_LAYER_REDIS_URL: redis://redis:6379/0
      DATA_LAYER_FALKORDB_HOST: falkordb
      DATA_LAYER_FALKORDB_PORT: "6379"
      DATA_LAYER_FALKORDB_DATABASE: ${DATA_LAYER_FALKORDB_DATABASE:-default}
      DATA_LAYER_QDRANT_URL: http://qdrant:6333
    networks:
      - data_layer

  agent-zero:
    # One-shot A0 WIRING into the shared volumes + postgres:
    #   deps.sh   → pip install psycopg + mcp INTO the shared /opt/venv-a0
    #               (real venv from the a0-init-populated volume — solves
    #               the /opt/venv-a0 problem structurally)
    #   plugin.sh → data_management plugin into the shared /a0/usr/plugins
    #   seed      → agent_frameworks/projects/agents rows (idempotent)
    # Exits 0 on success so the a0 runtime can gate on completion.
    build: ./data-layer-adapters
    image: data-layer-adapters
    container_name: data-layer-agent-zero
    restart: "no"
    depends_on:
      a0-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      ADAPTER_ROLE: agent-zero
      DATA_LAYER_LOCAL_CONTAINER_NAME: data-layer-a0
      DATA_LAYER_RUN_MIGRATE: "${DATA_LAYER_RUN_MIGRATE:-1}"
      DATA_LAYER_ADAPTERS_A0_A0_VENV: /opt/venv-a0
      DATA_LAYER_ADAPTERS_A0_A0_PLUGINS_DIR: /a0/usr/plugins
      DATA_LAYER_POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-postgres}
      DATA_LAYER_AGENT_ZERO_DSN: postgresql://agent_zero:${DATA_LAYER_AGENT_ZERO_PASSWORD:?DATA_LAYER_AGENT_ZERO_PASSWORD is required}@postgres:5432/postgres
      DATA_LAYER_REDIS_URL: redis://redis:6379/0
      DATA_LAYER_FALKORDB_HOST: falkordb
      DATA_LAYER_FALKORDB_PORT: "6379"
      DATA_LAYER_FALKORDB_DATABASE: ${DATA_LAYER_FALKORDB_DATABASE:-default}
    volumes:
      - a0_venv:/opt/venv-a0
      - a0_usr:/a0/usr
    networks:
      - data_layer

  a0:
    # Hardened Agent Zero RUNTIME — same image, same shared volumes as the
    # wiring step, so it boots with the data_management plugin installed and
    # psycopg/mcp present in its venv. WebUI 81 (+1 rule), SSH 23.
    image: agent0ai/agent-zero:latest
    container_name: data-layer-a0
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      a0-init:
        condition: service_completed_successfully
      agent-zero:
        condition: service_completed_successfully
    ports:
      - "81:80"    # WebUI  (+1 rule; standard 80)
      - "23:22"    # SSH    (+1 rule; standard 22)
    environment:
      # data-layer wiring for the writer plugin (standard internal ports)
      DATA_LAYER_POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-postgres}
      DATA_LAYER_AGENT_ZERO_DSN: postgresql://agent_zero:${DATA_LAYER_AGENT_ZERO_PASSWORD:?DATA_LAYER_AGENT_ZERO_PASSWORD is required}@postgres:5432/postgres
      DATA_LAYER_REDIS_URL: redis://redis:6379/0
      DATA_LAYER_REDIS_HOST: redis
      DATA_LAYER_REDIS_PORT: "6379"
      DATA_LAYER_FALKORDB_HOST: falkordb
      DATA_LAYER_FALKORDB_PORT: "6379"
      DATA_LAYER_QDRANT_URL: http://qdrant:6333
      DATA_LAYER_DW_SESSION_PRESENCE: "${DATA_LAYER_DW_SESSION_PRESENCE:-true}"
      DATA_LAYER_DW_TOOL_EXECUTION: "${DATA_LAYER_DW_TOOL_EXECUTION:-true}"
    volumes:
      - a0_usr:/a0/usr
      - a0_venv:/opt/venv-a0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - data_layer

volumes:
  postgres_data:
  redis_data:
  falkordb_data:
  qdrant_storage:
  a0_venv:      # /opt/venv-a0 — populated from the A0 image by a0-init
  a0_usr:       # /a0/usr — A0 state: plugins, settings, chats, memory

networks:
  data_layer:
    driver: bridge
    # Explicit network name so the hardened A0 compose file (and any future
    # layer / bulk-prefabricated-agent stack) can attach externally by name.
    name: data_layer
